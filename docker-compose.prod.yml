# 生產部署（預設：雲端 DB / 阿里雲 RDS）：redis + migrate + app
# 雲端 DB 模式：.env 設 DATABASE_URL → docker compose -f docker-compose.prod.yml up -d --build
# 本機 DB 模式：docker compose -f docker-compose.prod.yml -f docker-compose.local-db.yml up -d --build
services:
  redis:
    image: redis:7-alpine
    container_name: hangs-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6380:6379"

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-}
    container_name: hangs-migrate
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/hangs_db?schema=public}
    command: ["npx", "prisma", "migrate", "deploy"]
    # 雲端 DB 短暫連唔上會自動重試（本機模式靠 overlay 嘅 healthy 條件）
    restart: on-failure

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-}
    container_name: hangs-app
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/hangs_db?schema=public}
      - REDIS_URL=redis://hangs-redis:6379/0
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_ADMIN_USERNAME=${AUTH_ADMIN_USERNAME}
      - AUTH_ADMIN_PASSWORD=${AUTH_ADMIN_PASSWORD}
      - AUTH_TRUST_HOST=true
      - HOSTNAME=0.0.0.0
    depends_on:
      redis:
        condition: service_started
    # 綁 0.0.0.0：NPM 若係 docker 容器，要經 docker bridge（172.17.0.1）先入到嚟；
    # 127.0.0.1 只對主機原生反代有效。外界訪問靠阿里雲安全組封 3000（只開 80/443）。
    ports:
      - "0.0.0.0:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  redis-data:
