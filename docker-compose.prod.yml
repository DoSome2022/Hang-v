services:
  db:
    image: postgres:16-alpine
    container_name: hangs-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: hangs_db
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hangs_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hangs-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6380:6379"

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-}
    container_name: hangs-migrate
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/hangs_db?schema=public
    depends_on:
      db:
        condition: service_healthy
    command: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-}
    container_name: hangs-app
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/hangs_db?schema=public
      - REDIS_URL=redis://hangs-redis:6379/0
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_ADMIN_USERNAME=${AUTH_ADMIN_USERNAME}
      - AUTH_ADMIN_PASSWORD=${AUTH_ADMIN_PASSWORD}
      - AUTH_TRUST_HOST=true
      - HOSTNAME=0.0.0.0
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
    # 綁 0.0.0.0：NPM 若係 docker 容器，要經 docker bridge（172.17.0.1）先入到嚟；
    # 127.0.0.1 只對主機原生反代有效。外界訪問靠阿里雲安全組封 3000（只開 80/443）。
    ports:
      - "0.0.0.0:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  db-data:
  redis-data:
