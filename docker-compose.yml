services:
  db:
    image: postgres:16-alpine
    container_name: claude_hangs_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: claude_hangs
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  db-test:
    image: postgres:16-alpine
    container_name: claude_hangs_db_test
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: claude_hangs_test
    ports:
      - "5433:5432"
    volumes:
      - db_test_data:/var/lib/postgresql/data

volumes:
  db_data:
  db_test_data: