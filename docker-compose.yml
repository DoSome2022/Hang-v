# Dev 環境：db(5432) + db-test(5433) + 可選 redis
# 本機已有 Redis（localhost:6379）就唔使起 redis；冇就：
#   docker compose --profile redis up -d redis
services:
  db:
    image: postgres:16-alpine
    container_name: claude_hangs_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: claude_hangs
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  db-test:
    image: postgres:16-alpine
    container_name: claude_hangs_db_test
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: claude_hangs_test
    ports:
      - "5433:5432"
    volumes:
      - db_test_data:/var/lib/postgresql/data

  # 可選：本機未裝 Redis 時啟用（注意唔好同本機 6379 衝突）
  redis:
    image: redis:8-alpine
    container_name: claude_hangs_redis
    restart: unless-stopped
    profiles: ["redis"]
    ports:
      - "6380:6379"
    command: ["redis-server", "--appendonly", "no"]

volumes:
  db_data:
  db_test_data:
