# 本機 DB 模式 overlay（唔用雲端 RDS 時加呢個檔）：
#   docker compose -f docker-compose.prod.yml -f docker-compose.local-db.yml up -d --build
services:
  db:
    image: postgres:16-alpine
    container_name: hangs-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: hangs_db
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hangs_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    depends_on:
      db:
        condition: service_healthy

  app:
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
